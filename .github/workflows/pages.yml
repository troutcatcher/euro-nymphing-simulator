# Publishes the simulator to GitHub Pages. There is no build step — the site is
# the repository root. Requires the repository to be public (or a plan that
# includes Pages for private repositories), with Pages set to "GitHub Actions"
# under Settings -> Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/euro-nymphing-3d-tss4ww]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
